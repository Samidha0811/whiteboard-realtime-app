/* ══════════════════════════════════
   GLOBAL RESET & BASE
   ══════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
}
:root {
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;

  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color-scheme: light dark;
  color: var(--text-primary);
  background: var(--bg-primary);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  transition: background-color 0.4s ease, color 0.4s ease;
}
#root {
  width: 100%;
  margin: 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}
/* ══════════════════════════════════
   TYPOGRAPHY
   ══════════════════════════════════ */
h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--text-primary);
  margin: 0;
  line-height: 1.2;
}
h1 { font-size: 3rem; letter-spacing: -0.03em; }
h2 { font-size: 1.25rem; letter-spacing: -0.01em; }
h3 { font-size: 1rem; }
p {
  margin: 0;
  color: var(--text-secondary);
}
a {
  color: var(--accent-primary);
  text-decoration: none;
  transition: color 0.2s ease;
}
a:hover {
  color: var(--accent-hover);
}
code {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  padding: 0.2em 0.5em;
  border-radius: 6px;
  background: var(--bg-secondary);
  color: var(--text-primary);
}
/* ══════════════════════════════════
   CUSTOM SCROLLBAR
   ══════════════════════════════════ */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--accent-primary);
}
/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) transparent;
}
/* ══════════════════════════════════
   ANIMATION KEYFRAMES LIBRARY
   ══════════════════════════════════ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.95); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.5; }
}
@keyframes pulseRing {
  0%   { transform: scale(0.8); opacity: 1; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}
@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-20px) rotate(3deg); }
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes bounceIn {
  0%   { transform: scale(0.3); opacity: 0; }
  50%  { transform: scale(1.05); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}
/* ══════════════════════════════════
   UTILITY CLASSES
   ══════════════════════════════════ */
.gradient-text {
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.glass {
  background: var(--surface-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
}
.animate-fade-in     { animation: fadeIn 0.5s ease-out both; }
.animate-fade-in-up  { animation: fadeInUp 0.6s ease-out both; }
.animate-scale-in    { animation: fadeInScale 0.4s ease-out both; }
/* Selection color */
::selection {
  background: var(--accent-bg);
  color: var(--text-primary);
}
/* ══════════════════════════════════
   RESPONSIVE TYPOGRAPHY
   ══════════════════════════════════ */
@media (max-width: 1024px) {
  h1 { font-size: 2.25rem; }
  h2 { font-size: 1.1rem; }
}
@media (max-width: 600px) {
  h1 { font-size: 1.75rem; }
  :root { font-size: 15px; }
}

    color: var(--text-primary);
}

.user-status {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: color 0.3s ease;
}

.user-status.connected {
    color: var(--color-success);
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    position: relative;
}

.user-status.connected .status-dot {
    background: var(--color-success);
}

.user-status.connected .status-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--color-success);
    animation: pulseRing 2s ease-out infinite;
}

/* ── Session Info ── */
.session-info {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
}

.info-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.65rem;
    background: var(--bg-primary);
    border-radius: 10px;
    border: 1px solid var(--border-color);
}

.info-item label {
    font-size: 0.6rem;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    font-family: var(--font-heading);
}

.room-code-display {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-primary);
    letter-spacing: 0.1em;
}

.role-badge {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-primary);
}

.role-badge.host {
    color: var(--accent-primary);
}

/* ── Sidebar Divider ── */
.sidebar-divider {
    height: 1px;
    background: var(--border-color);
    margin-bottom: 1rem;
}

/* ── Sidebar Section ── */
.sidebar-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* ── Players List ── */
.players-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    overflow-y: auto;
    flex: 1;
}

.player-badge {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0.65rem;
    border-radius: 10px;
    transition: all 0.2s ease;
    animation: slideInLeft 0.3s ease-out both;
}

.player-badge:hover {
    background: var(--bg-primary);
}

.player-avatar {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    font-family: var(--font-heading);
}

.player-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
}

.you-tag {
    margin-left: auto;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-primary);
    background: var(--accent-bg);
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
}

.empty-state {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
    padding: 1rem 0;
    text-align: center;
}

/* ══════════════════════════════════
   CHAT
   ══════════════════════════════════ */

.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding-right: 0.25rem;
    padding-bottom: 0.5rem;
}

.chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 0.5rem;
}

.chat-empty p {
    font-size: 0.8rem;
    color: var(--text-muted);
}

/* ── Chat Bubble ── */
.chat-bubble {
    display: flex;
    flex-direction: column;
    padding: 0.55rem 0.85rem;
    border-radius: 12px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    max-width: 88%;
    align-self: flex-start;
    animation: fadeIn 0.25s ease-out both;
}

.chat-bubble.own-msg {
    align-self: flex-end;
    background: var(--accent-bg);
    border-color: transparent;
}

.chat-bubble.system-msg {
    align-self: center;
    background: transparent;
    border: none;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.7;
    padding: 0.25rem 0;
}

.chat-sender {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--accent-primary);
    margin-bottom: 0.15rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.chat-text {
    font-size: 0.85rem;
    color: var(--text-primary);
    line-height: 1.5;
    word-break: break-word;
}

/* ── Chat Input ── */
.chat-input-area {
    display: flex;
    gap: 0.5rem;
    padding-top: 0.75rem;
    margin-top: auto;
    border-top: 1px solid var(--border-color);
}

.chat-input {
    flex: 1;
    padding: 0.6rem 0.85rem;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.85rem;
    outline: none;
    transition: all 0.25s ease;
}

.chat-input:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-bg);
}

.chat-input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
}

.chat-send-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--gradient-primary);
    color: var(--button-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.chat-send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 0 16px var(--accent-glow);
}

.chat-send-btn:disabled {
    opacity: 0.4;
    cursor: default;
}

/* ══════════════════════════════════
   CENTER / LOADING
   ══════════════════════════════════ */

.game-center-container {
    width: 100%;
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.canvas-loading {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--text-muted);
}

.loading-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    background: var(--bg-primary);
    color: var(--text-muted);
}

.loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border-color);
    border-top-color: var(--accent-primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
